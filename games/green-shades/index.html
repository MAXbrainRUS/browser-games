<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зелёные">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Оттенки зелёного</title>
<script src="../../shared/game-kit.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: a rack of paint-sample cards in two columns; the word tray sticks to the bottom so names can be dragged up onto the cards with one thumb */
:root{
  --bg:#F2F6F2; --surface:#FFFFFF; --fg:#18211B; --muted:#5E6B62; --line:#D2DDD4;
  --ink:#1D2B22; --ink-fg:#FFFFFF; --focus:#1D3B2A;
  --ok:#2E7D4F; --ok-bg:#E5F2E9; --bad:#B42318; --bad-bg:#FBE8E6;
  --shadow:rgba(10,30,15,.22);
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101511; --surface:#19201B; --fg:#E9F1EB; --muted:#98A79C; --line:#2E3A31;
  --ink:#E9F1EB; --ink-fg:#121813; --focus:#BFE8CF;
  --ok:#6CCB8F; --ok-bg:#15281C; --bad:#F2877C; --bad-bg:#2E1715;
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#19201B; --fg:#E9F1EB; --muted:#98A79C; --line:#2E3A31;
  --ink:#E9F1EB; --ink-fg:#121813; --focus:#BFE8CF;
  --ok:#6CCB8F; --ok-bg:#15281C; --bad:#F2877C; --bad-bg:#2E1715;
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 2px -6px;padding:0 6px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;text-decoration:none}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.back svg{width:16px;height:16px}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:6px 0 0;max-width:46ch}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;padding-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card.over{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
/* after checking, a wrong card shows the right name under the hex code */
.swatch{min-height:46px;background:var(--c);padding:6px 6px 6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hex{font-family:var(--f-mono);font-size:11px;line-height:1.2;letter-spacing:.04em;color:var(--t)}
.pill{margin:auto 0 0 -2px;max-width:calc(100% + 2px);box-sizing:border-box;background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{flex:1;min-height:46px;padding:5px;display:flex;align-items:center;border-top:1px solid var(--line);transition:background .15s}
.ph{flex:1;height:34px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px}
.armed .ph{border-color:var(--focus);color:var(--focus)}
.card.ok .slot{background:var(--ok-bg)}
.card.ok .chip{border-color:var(--ok);color:var(--ok)}
.card.bad .slot{background:var(--bad-bg)}
.card.bad .chip{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip{font:inherit;font-size:14.5px;font-weight:500;min-height:34px;padding:6px 11px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 0 var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap}
.slot .chip{flex:1;min-width:0;overflow:hidden;white-space:normal;line-height:1.2}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip.sel{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
.chip.lifted{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 10px 24px var(--shadow);border-color:var(--focus);cursor:grabbing}
.tray{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom, 0px));margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:5}
.tray-head{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tray-head span:last-child{font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none}
.bank{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;padding:7px;margin-top:6px;border:1px dashed var(--line);border-radius:10px;align-content:flex-start;transition:border-color .15s}
.bank.over{border-color:var(--focus);border-style:solid}
.bank .empty{color:var(--muted);font-size:13px;align-self:center;padding:0 4px}
.actions{display:flex;gap:10px;margin-top:10px}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:46px;border-radius:10px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{flex:1;background:var(--ink);color:var(--ink-fg);border:0}
.ghost-btn{background:transparent;color:var(--fg);border:1px solid var(--line);padding:0 18px}
.result{margin:8px 0 0;min-height:21px;font-size:14.5px;font-variant-numeric:tabular-nums}
.result.win{color:var(--ok);font-weight:600}
/* Phone held sideways: the tray would cover most of the short screen, so it moves to a column on the right */
@media (orientation: landscape) and (max-height: 520px){
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,36%);grid-template-rows:auto 1fr;column-gap:20px}
  .wrap>header{grid-area:1/1}
  .board{grid-area:2/1;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tray{grid-area:1/2/3/3;align-self:start;top:0;bottom:auto;max-height:100vh;max-height:100dvh;overflow-y:auto;margin:0;border-top:0;padding:0 0 calc(12px + env(safe-area-inset-bottom, 0px))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="wrap">
  <header>
    <a class="back" href="../../" data-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все игры</a>
    <h1>Оттенки зелёного</h1>
    <p class="sub">Перетащи название на цвет. Слова на карточках можно менять местами. Без перетаскивания: нажми на слово, потом на цвет.</p>
  </header>
  <section id="board" class="board" aria-label="Цвета"></section>
  <section id="tray" class="tray" aria-label="Названия">
    <div class="tray-head"><span>Названия</span><span id="left"></span></div>
    <div id="bank" class="bank" data-drop="bank"></div>
    <p id="result" class="result" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="check" class="btn primary" type="button">Проверить</button>
      <button id="reset" class="btn ghost-btn" type="button">Заново</button>
    </div>
  </section>
</main>

<script>
/* Any two differ by at least 10.2 in CIEDE2000 (the closest pair in purple-shades is 5.1): close, but never a coin toss */
const COLORS=[
  {n:'Изумрудный',hex:'#009B77'},
  {n:'Оливковый',hex:'#808000'},
  {n:'Лаймовый',hex:'#A3D134'},
  {n:'Мятный',hex:'#A6EBC9'},
  {n:'Хаки',hex:'#8F8A5C'},
  {n:'Шалфейный',hex:'#9CAF88'},
  {n:'Фисташковый',hex:'#BCD88A'},
  {n:'Еловый',hex:'#0A5F38'},
];
const N=COLORS.length;
const SIDE_TRAY=matchMedia('(orientation: landscape) and (max-height: 520px)');
const board=document.getElementById('board'), bankEl=document.getElementById('bank'), tray=document.getElementById('tray');
const leftEl=document.getElementById('left'), resultEl=document.getElementById('result');
const KEY='green-shades.v1';

let S, sel=null, drag=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function range(){return [...Array(N).keys()];}
function newGame(){return {slots:shuffle(range()),placed:Array(N).fill(null),bank:shuffle(range()),checked:false};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(_){return null;}}
function valid(s){
  if(!s||!Array.isArray(s.slots)||!Array.isArray(s.placed)||!Array.isArray(s.bank))return false;
  const perm=a=>a.length===N&&new Set(a).size===N&&a.every(i=>Number.isInteger(i)&&i>=0&&i<N);
  return perm(s.slots)&&s.placed.length===N&&perm(s.placed.filter(w=>w!=null).concat(s.bank));
}
/* dark or white text, whichever contrasts more (WCAG luminance: plain brightness puts white on bright greens) */
function inkFor(hex){const v=parseInt(hex.slice(1),16),lin=c=>(c/=255)<=0.04045?c/12.92:((c+0.055)/1.055)**2.4;
  const L=0.2126*lin(v>>16&255)+0.7152*lin(v>>8&255)+0.0722*lin(v&255);return L>0.179?'rgba(12,30,18,.78)':'rgba(255,255,255,.9)';}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function chip(w,from){
  const b=el('button','chip',COLORS[w].n);
  b.type='button';b.dataset.w=w;b.dataset.from=from;
  if(sel&&sel.w===w)b.classList.add('sel');
  return b;
}

function render(){
  save();
  board.classList.toggle('armed',!!sel);
  board.innerHTML='';
  S.slots.forEach((ci,i)=>{
    const c=COLORS[ci], w=S.placed[i];
    const card=el('div','card');
    card.dataset.drop='slot';card.dataset.slot=i;card.tabIndex=0;card.setAttribute('role','button');
    card.setAttribute('aria-label','Цвет '+(i+1)+', '+(w!=null?'стоит «'+COLORS[w].n+'»':'пусто'));
    if(S.checked&&w!=null)card.classList.add(w===ci?'ok':'bad');
    const sw=el('div','swatch');sw.style.setProperty('--c',c.hex);sw.style.setProperty('--t',inkFor(c.hex));
    sw.appendChild(el('span','hex',c.hex));
    if(S.checked&&w!=null&&w!==ci)sw.appendChild(el('span','pill',c.n));
    const slot=el('div','slot');
    slot.appendChild(w!=null?chip(w,i):el('div','ph','сюда'));
    card.append(sw,slot);board.appendChild(card);
  });
  bankEl.innerHTML='';
  if(S.bank.length)S.bank.forEach(w=>bankEl.appendChild(chip(w,'bank')));
  else bankEl.appendChild(el('span','empty','Все названия на местах. Нажми «Проверить».'));
  leftEl.textContent=S.bank.length?'осталось '+S.bank.length:'';
  if(S.checked){
    const k=S.slots.filter((ci,i)=>S.placed[i]===ci).length, e=S.placed.filter(x=>x==null).length;
    resultEl.className='result'+(k===N?' win':'');
    resultEl.textContent=k===N?'Все '+N+' верно!':'Верно '+k+' из '+N+(e?', пустых: '+e:'')+'. Красные можно поправить и проверить снова.';
  }else{resultEl.className='result';resultEl.textContent='';}
}

function move(w,from,to){
  if(to==='bank'){
    if(from==='bank')return render();
    S.placed[from]=null;S.bank.push(w);
  }else{
    if(from===to)return render();
    const occ=S.placed[to];
    if(from==='bank'){S.bank.splice(S.bank.indexOf(w),1);if(occ!=null)S.bank.push(occ);}
    else S.placed[from]=occ;
    S.placed[to]=w;
  }
  S.checked=false;render();
}

function fromOf(c){return c.dataset.from==='bank'?'bank':+c.dataset.from;}
function tapChip(c){
  const w=+c.dataset.w, from=fromOf(c);
  if(sel&&sel.w===w){sel=null;return render();}
  if(sel&&from!=='bank'){const s=sel;sel=null;return move(s.w,s.from,from);}
  if(sel&&from==='bank'&&sel.from!=='bank'){const s=sel;sel=null;return move(w,'bank',s.from);}
  sel={w,from};render();
}

/* drag with pointer events: works for finger and mouse */
let overEl=null;
function setOver(t){if(overEl===t)return;if(overEl)overEl.classList.remove('over');overEl=t;if(t)t.classList.add('over');}
function targetAt(x,y){const t=document.elementFromPoint(x,y);return t?t.closest('[data-drop]'):null;}

document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');
  if(!c||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  drag={c,w:+c.dataset.w,from:fromOf(c),x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false,ghost:null};
  try{c.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  drag.x=e.clientX;drag.y=e.clientY;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<7)return;
    drag.moved=true;
    if(sel){sel=null;document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));board.classList.remove('armed');}
    const r=drag.c.getBoundingClientRect();
    const g=drag.c.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');
    g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=r.width+'px';
    document.body.appendChild(g);drag.ghost=g;drag.c.classList.add('lifted');
    drag.raf=requestAnimationFrame(autoScroll);
  }
  drag.ghost.style.transform='translate('+dx+'px,'+dy+'px) scale(1.04)';
  setOver(targetAt(e.clientX,e.clientY));
});
function autoScroll(){
  if(!drag||!drag.moved)return;
  const y=drag.y, top=SIDE_TRAY.matches?innerHeight:tray.getBoundingClientRect().top;let v=0;
  if(y<64)v=-Math.ceil((64-y)/5);
  else if(y<top&&y>top-56)v=Math.ceil((y-(top-56))/5);
  if(v){window.scrollBy(0,v);setOver(targetAt(drag.x,drag.y));}
  drag.raf=requestAnimationFrame(autoScroll);
}
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;cancelAnimationFrame(d.raf);
  if(d.ghost)d.ghost.remove();
  const t=overEl;setOver(null);
  if(!d.moved){if(!cancel)tapChip(d.c);return;}
  if(cancel||!t)return render();
  move(d.w,d.from,t.dataset.drop==='bank'?'bank':+t.dataset.slot);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* taps on cards / tray, and keyboard */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){if(e.detail===0)tapChip(c);return;}
  if(!sel)return;
  const card=e.target.closest('.card');
  if(card){const s=sel;sel=null;return move(s.w,s.from,+card.dataset.slot);}
  if(e.target.closest('#bank')&&sel.from!=='bank'){const s=sel;sel=null;return move(s.w,s.from,'bank');}
});
board.addEventListener('keydown',e=>{
  const card=e.target.closest('.card');
  if(!card||e.target!==card)return;
  if((e.key==='Enter'||e.key===' ')&&sel){e.preventDefault();const s=sel;sel=null;move(s.w,s.from,+card.dataset.slot);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel){sel=null;render();}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.chip'))e.preventDefault();});

document.getElementById('check').addEventListener('click',()=>{sel=null;S.checked=true;render();});
document.getElementById('reset').addEventListener('click',()=>{sel=null;S=newGame();render();window.scrollTo(0,0);});

const saved=load();
S=valid(saved)?saved:newGame();
render();
</script>

</body></html>
